<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Distribution Explorer</title>
<style>
  body { margin: 0; font-family: system-ui, "Segoe UI", Ubuntu, sans-serif; background: #fff; color: #222; }
  main { max-width: 1280px; margin: 0 auto; padding: 20px 16px; }
  h1 { font-size: 1.4em; margin: 0 0 12px; font-weight: 600; }
  footer { display: flex; justify-content: flex-end; margin-top: 14px; }
  .stamp { font-size: 0.85em; color: #8a4b12; border: 1.5px solid #d2691e; border-radius: 4px; padding: 3px 10px;
    background: #fdf5ee; white-space: nowrap; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; border-bottom: 1px solid #ccc; }
  .tabs button { font: inherit; font-size: 1.02em; padding: 7px 16px; border: 1px solid #ccc; border-bottom: none;
    border-radius: 6px 6px 0 0; background: #f4f4f4; color: #333; cursor: pointer; margin-bottom: -1px; }
  .tabs button.active { background: #fff; color: #1f5fa8; font-weight: 600; border-bottom: 1px solid #fff; }
  .tabs .sep { align-self: center; color: #888; font-size: 0.9em; margin: 0 6px 0 12px; }
  .controls { display: grid; grid-template-columns: auto 1fr auto; gap: 10px 14px; align-items: center; margin-bottom: 12px; max-width: 900px; }
  .controls label { font-size: 1.1em; }
  input[type=range] { width: 100%; }
  .val { font-family: ui-monospace, monospace; font-size: 1.1em; min-width: 4.5em; text-align: right; }
  .hidden { display: none !important; }
  .stats { font-size: 1em; margin: 4px 0 10px; color: #444; }
  .plots { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  canvas { width: 100%; height: 420px; display: block; border: 1px solid #ddd; border-radius: 4px; }
  .plots.withtable { grid-template-columns: 1fr 1fr auto; }
  .pmftable { align-self: start; }
  .pmftable table { border-collapse: collapse; font-size: 0.92em; }
  .pmftable th, .pmftable td { border: 1px solid #ccc; padding: 3px 10px; text-align: center; line-height: 1.25; }
  .pmftable th { background: #f4f4f4; font-weight: 600; white-space: nowrap; }
  .pmftable td { font-family: ui-monospace, monospace; }
  @media (max-width: 800px) { .plots, .plots.withtable { grid-template-columns: 1fr; } canvas { height: 340px; } }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <div class="tabs">
    <span class="sep">Discrete:</span>
    <button data-dist="binom" class="active">Binomial</button>
    <button data-dist="pois">Poisson</button>
    <span class="sep">Continuous:</span>
    <button data-dist="gauss">Gaussian</button>
    <button data-dist="expo">Exponential</button>
  </div>
  <div class="controls" id="binomControls">
    <label for="N"><i>N</i></label>
    <input id="N" type="range" min="1" max="200" step="1" value="10">
    <span id="Nval" class="val"></span>
    <label for="p"><i>p</i></label>
    <input id="p" type="range" min="0" max="1" step="0.01" value="0.5">
    <span id="pval" class="val"></span>
  </div>
  <div class="controls hidden" id="poisControls">
    <label for="lam"><i>&lambda;</i></label>
    <input id="lam" type="range" min="0.1" max="50" step="0.1" value="4">
    <span id="lamval" class="val"></span>
  </div>
  <div class="controls hidden" id="gaussControls">
    <label for="gmu"><i>&mu;</i></label>
    <input id="gmu" type="range" min="-5" max="5" step="0.1" value="0">
    <span id="gmuval" class="val"></span>
    <label for="gvar"><i>&sigma;</i>&sup2;</label>
    <input id="gvar" type="range" min="0.25" max="10" step="0.05" value="1">
    <span id="gvarval" class="val"></span>
  </div>
  <div class="controls hidden" id="expoControls">
    <label for="elam"><i>&lambda;</i></label>
    <input id="elam" type="range" min="0.2" max="5" step="0.05" value="1">
    <span id="elamval" class="val"></span>
  </div>
  <div class="stats" id="stats"></div>
  <div class="plots">
    <canvas id="pmfPlot"></canvas>
    <canvas id="cdfPlot"></canvas>
    <div class="pmftable hidden" id="pmfTable"></div>
  </div>
</main>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var BLUE = '#1f5fa8', ORANGE = '#d2691e';
  var current = 'binom';

  function logFact(n) {
    var lf = [0];
    for (var k = 1; k <= n; k++) lf[k] = lf[k - 1] + Math.log(k);
    return lf;
  }

  // Pr(X = k) for k = 0..N, computed in log space so large N stays accurate.
  function binomPmf(N, p) {
    var out = [], lf = logFact(N);
    for (var k = 0; k <= N; k++) {
      if (p === 0) out[k] = k === 0 ? 1 : 0;
      else if (p === 1) out[k] = k === N ? 1 : 0;
      else out[k] = Math.exp(lf[N] - lf[k] - lf[N - k] + k * Math.log(p) + (N - k) * Math.log(1 - p));
    }
    return out;
  }

  // Pr(X = k) for k = 0..kmax.
  function poisPmf(lam, kmax) {
    var out = [], lf = logFact(kmax);
    for (var k = 0; k <= kmax; k++) out[k] = Math.exp(-lam + k * Math.log(lam) - lf[k]);
    return out;
  }

  // erf via Abramowitz & Stegun 7.1.26 (absolute error < 1.5e-7).
  function erf(x) {
    var s = x < 0 ? -1 : 1; x = Math.abs(x);
    var t = 1 / (1 + 0.3275911 * x);
    var y = 1 - ((((1.061405429 * t - 1.453152027) * t + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x);
    return s * y;
  }

  function niceStep(range, target) {
    var raw = range / target, mag = Math.pow(10, Math.floor(Math.log10(raw))), r = raw / mag;
    return (r < 1.5 ? 1 : r < 3 ? 2 : r < 7 ? 5 : 10) * mag;
  }

  // Sets up a canvas with axes for x in [xlo, xhi] and y in [0, ytop]; returns coordinate maps.
  // For discrete plots the x range is padded by half a unit so the end stems are not on the frame.
  function axes(canvas, xlo, xhi, ytop, ystep, ylabel, discrete, title) {
    var ctx = canvas.getContext('2d'), dpr = window.devicePixelRatio || 1;
    var W = canvas.clientWidth, H = canvas.clientHeight;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    var L = 66, R = 16, T = 34, B = 52, pw = W - L - R, ph = H - T - B;
    var xmin = discrete ? xlo - 0.5 : xlo, xmax = discrete ? xhi + 0.5 : xhi;
    var g = {
      ctx: ctx, L: L, T: T, pw: pw, ph: ph, xmin: xmin, xmax: xmax,
      X: function (v) { return L + (v - xmin) / (xmax - xmin) * pw; },
      Y: function (v) { return T + ph - Math.min(v, ytop * 1.02) / ytop * ph; }
    };
    ctx.font = '13px system-ui, sans-serif'; ctx.fillStyle = '#444';
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    var ydec = Math.max(0, -Math.floor(Math.log10(ystep)));
    for (var y = 0; y <= ytop + 1e-12; y += ystep) {
      ctx.strokeStyle = '#eee'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(L, g.Y(y)); ctx.lineTo(L + pw, g.Y(y)); ctx.stroke();
      ctx.fillText(y.toFixed(ydec), L - 8, g.Y(y));
    }
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    var xstep = niceStep(Math.max(xhi - xlo, 1), 8);
    if (discrete) xstep = Math.max(1, xstep);
    for (var x = Math.ceil(xlo / xstep) * xstep; x <= xhi + 1e-9; x += xstep) {
      ctx.strokeStyle = '#888';
      ctx.beginPath(); ctx.moveTo(g.X(x), T + ph); ctx.lineTo(g.X(x), T + ph + 5); ctx.stroke();
      ctx.fillText(+x.toFixed(6), g.X(x), T + ph + 8);
    }
    ctx.strokeStyle = '#333';
    ctx.beginPath(); ctx.moveTo(L, T); ctx.lineTo(L, T + ph); ctx.lineTo(L + pw, T + ph); ctx.stroke();
    ctx.font = 'italic 15px system-ui, sans-serif'; ctx.fillStyle = '#222';
    ctx.fillText('x', L + pw / 2, T + ph + 28);
    // ylabel is a list of [text, isSubscript] pieces, drawn rotated and centred.
    ctx.save(); ctx.translate(16, T + ph / 2); ctx.rotate(-Math.PI / 2);
    ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    var fonts = ['italic 15px system-ui, sans-serif', 'italic 11px system-ui, sans-serif'], wsum = 0, i;
    for (i = 0; i < ylabel.length; i++) { ctx.font = fonts[+ylabel[i][1]]; wsum += ctx.measureText(ylabel[i][0]).width; }
    var cx = -wsum / 2;
    for (i = 0; i < ylabel.length; i++) {
      ctx.font = fonts[+ylabel[i][1]];
      ctx.fillText(ylabel[i][0], cx, ylabel[i][1] ? 5 : 0);
      cx += ctx.measureText(ylabel[i][0]).width;
    }
    ctx.restore();
    ctx.font = '600 14px system-ui, sans-serif'; ctx.fillStyle = '#222';
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(title, L, T - 16);
    return g;
  }

  // mu +/- sigma band, dashed mean line and their legend.
  function meanMarks(g, mu, sigma) {
    var ctx = g.ctx;
    var a = Math.max(g.xmin, mu - sigma), b = Math.min(g.xmax, mu + sigma);
    ctx.fillStyle = 'rgba(220, 120, 30, 0.10)';
    ctx.fillRect(g.X(a), g.T, g.X(b) - g.X(a), g.ph);
    ctx.strokeStyle = ORANGE; ctx.lineWidth = 2; ctx.setLineDash([6, 4]);
    ctx.beginPath(); ctx.moveTo(g.X(mu), g.T); ctx.lineTo(g.X(mu), g.T + g.ph); ctx.stroke();
    ctx.setLineDash([]);
    if (g.pw < 430) return;
    var lx = g.L + g.pw - 170, ly = g.T - 16;
    ctx.font = '13px system-ui, sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.strokeStyle = ORANGE; ctx.lineWidth = 2; ctx.setLineDash([6, 4]);
    ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(lx + 22, ly); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = '#222'; ctx.fillText('mean μ', lx + 28, ly);
    ctx.fillStyle = 'rgba(220, 120, 30, 0.25)'; ctx.fillRect(lx + 92, ly - 6, 22, 12);
    ctx.fillStyle = '#222'; ctx.fillText('μ ± σ', lx + 120, ly);
  }

  function dotRadius(g, n) { return Math.max(1.5, Math.min(5, g.pw / n / 3)); }

  var CDF_LABEL = [['F', false], ['X', true], ['(x) = Pr(X ≤ x)', false]];

  function drawPmf(probs, mu, sigma) {
    // Probability axis fixed at [0, 1] so shapes can be compared as the parameters change.
    var g = axes($('pmfPlot'), 0, probs.length - 1, 1, 0.2, [['Pr(X = x)', false]], true, 'Probability mass function');
    var ctx = g.ctx;
    meanMarks(g, mu, sigma);
    var r = dotRadius(g, probs.length);
    ctx.strokeStyle = BLUE; ctx.fillStyle = BLUE; ctx.lineWidth = Math.max(1, Math.min(2.5, r / 2));
    for (var k = 0; k < probs.length; k++) {
      ctx.beginPath(); ctx.moveTo(g.X(k), g.Y(0)); ctx.lineTo(g.X(k), g.Y(probs[k])); ctx.stroke();
      ctx.beginPath(); ctx.arc(g.X(k), g.Y(probs[k]), r, 0, 2 * Math.PI); ctx.fill();
    }
  }

  // Right-continuous step function F_X(x) = Pr(X <= x).
  function drawDiscreteCdf(probs) {
    var n = probs.length, F = [], s = 0, k;
    for (k = 0; k < n; k++) { s += probs[k]; F[k] = Math.min(1, s); }
    var g = axes($('cdfPlot'), 0, n - 1, 1, 0.2, CDF_LABEL, true, 'Cumulative distribution function');
    var ctx = g.ctx, r = dotRadius(g, n), dense = r < 2.5;
    ctx.strokeStyle = BLUE; ctx.lineWidth = Math.max(1, Math.min(2.5, r / 2));
    ctx.beginPath(); ctx.moveTo(g.X(g.xmin), g.Y(0)); ctx.lineTo(g.X(0), g.Y(0)); ctx.stroke();
    for (k = 0; k < n; k++) {
      if (dense) { ctx.beginPath(); ctx.moveTo(g.X(k), g.Y(k === 0 ? 0 : F[k - 1])); ctx.lineTo(g.X(k), g.Y(F[k])); ctx.stroke(); }
      ctx.beginPath(); ctx.moveTo(g.X(k), g.Y(F[k])); ctx.lineTo(g.X(Math.min(k + 1, g.xmax)), g.Y(F[k])); ctx.stroke();
    }
    if (dense) return;
    // Open circle at the bottom of each jump, filled circle at the value taken
    for (k = 0; k < n; k++) {
      var below = k === 0 ? 0 : F[k - 1];
      if (F[k] - below > 1e-9) {
        ctx.fillStyle = '#fff'; ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.arc(g.X(k), g.Y(below), r, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();
      }
      ctx.fillStyle = BLUE;
      ctx.beginPath(); ctx.arc(g.X(k), g.Y(F[k]), r, 0, 2 * Math.PI); ctx.fill();
    }
  }

  // Samples fn over [xlo, xhi]; `jump` is an x where fn is discontinuous, drawn as a vertical step.
  function curve(fn, xlo, xhi, jump) {
    var pts = [], n = 800;
    for (var i = 0; i <= n; i++) {
      var x = xlo + (xhi - xlo) * i / n;
      if (jump !== undefined && pts.length && pts[pts.length - 1][0] < jump && x >= jump) {
        pts.push([jump, fn(jump - 1e-12)], [jump, fn(jump)]);
      }
      pts.push([x, fn(x)]);
    }
    return pts;
  }

  function strokeCurve(g, pts, fill) {
    var ctx = g.ctx, i;
    ctx.beginPath(); ctx.moveTo(g.X(pts[0][0]), g.Y(pts[0][1]));
    for (i = 1; i < pts.length; i++) ctx.lineTo(g.X(pts[i][0]), g.Y(pts[i][1]));
    if (fill) {
      ctx.save();
      ctx.lineTo(g.X(pts[pts.length - 1][0]), g.Y(0)); ctx.lineTo(g.X(pts[0][0]), g.Y(0)); ctx.closePath();
      ctx.fillStyle = 'rgba(31, 95, 168, 0.12)'; ctx.fill(); ctx.restore();
      ctx.beginPath(); ctx.moveTo(g.X(pts[0][0]), g.Y(pts[0][1]));
      for (i = 1; i < pts.length; i++) ctx.lineTo(g.X(pts[i][0]), g.Y(pts[i][1]));
    }
    ctx.strokeStyle = BLUE; ctx.lineWidth = 2.5; ctx.stroke();
  }

  function drawContinuous(d) {
    var g = axes($('pmfPlot'), d.xlo, d.xhi, d.ytop, d.ystep, [['p', false], ['X', true], ['(x)', false]], false, 'Probability density function');
    meanMarks(g, d.mu, d.sigma);
    strokeCurve(g, curve(d.pdf, d.xlo, d.xhi, d.jump), true);
    g = axes($('cdfPlot'), d.xlo, d.xhi, 1, 0.2, CDF_LABEL, false, 'Cumulative distribution function');
    strokeCurve(g, curve(d.cdf, d.xlo, d.xhi), false);
  }

  var DISTS = {
    binom: function () {
      var N = +$('N').value, p = +$('p').value;
      $('Nval').textContent = N; $('pval').textContent = p.toFixed(2);
      var mu = N * p, sigma = Math.sqrt(N * p * (1 - p));
      return { probs: binomPmf(N, p), mu: mu, sigma: sigma,
        title: 'Binomial distribution &nbsp;X ~ B(N, p)',
        stats: 'Mean &mu; = <i>Np</i> = ' + mu.toFixed(3) +
          ' &nbsp;&nbsp; Std. dev. &sigma; = &radic;(<i>Np</i>(1&minus;<i>p</i>)) = ' + sigma.toFixed(3) };
    },
    pois: function () {
      var lam = +$('lam').value;
      $('lamval').textContent = lam.toFixed(1);
      // Poisson support is unbounded; show x up to where the tail is negligible.
      var kmax = Math.max(10, Math.ceil(lam + 6 * Math.sqrt(lam) + 4));
      return { probs: poisPmf(lam, kmax), mu: lam, sigma: Math.sqrt(lam),
        title: 'Poisson distribution &nbsp;X ~ Poisson(&lambda;)',
        stats: 'Mean &mu; = &lambda; = ' + lam.toFixed(3) +
          ' &nbsp;&nbsp; Std. dev. &sigma; = &radic;&lambda; = ' + Math.sqrt(lam).toFixed(3) };
    },
    // Axes are fixed for the continuous tabs; the slider ranges keep the PDF peak inside them.
    gauss: function () {
      var mu = +$('gmu').value, v = +$('gvar').value, s = Math.sqrt(v);
      $('gmuval').textContent = mu.toFixed(1); $('gvarval').textContent = v.toFixed(2);
      return { mu: mu, sigma: s, xlo: -15, xhi: 15, ytop: 1, ystep: 0.2,
        pdf: function (x) { return Math.exp(-(x - mu) * (x - mu) / (2 * v)) / Math.sqrt(2 * Math.PI * v); },
        cdf: function (x) { return 0.5 * (1 + erf((x - mu) / (s * Math.SQRT2))); },
        title: 'Gaussian distribution &nbsp;X ~ N(&mu;, &sigma;&sup2;)',
        stats: 'Mean = &mu; = ' + mu.toFixed(3) + ' &nbsp;&nbsp; Std. dev. &sigma; = ' + s.toFixed(3) };
    },
    expo: function () {
      var lam = +$('elam').value;
      $('elamval').textContent = lam.toFixed(2);
      return { mu: 1 / lam, sigma: 1 / lam, xlo: -1, xhi: 10, ytop: 5, ystep: 1, jump: 0,
        pdf: function (x) { return x < 0 ? 0 : lam * Math.exp(-lam * x); },
        cdf: function (x) { return x < 0 ? 0 : 1 - Math.exp(-lam * x); },
        title: 'Exponential distribution &nbsp;X ~ Exp(&lambda;)',
        stats: 'Mean &mu; = 1/&lambda; = ' + (1 / lam).toFixed(3) +
          ' &nbsp;&nbsp; Std. dev. &sigma; = 1/&lambda; = ' + (1 / lam).toFixed(3) };
    }
  };

  function draw() {
    var d = DISTS[current]();
    $('title').innerHTML = d.title;
    var ratio = Math.abs(d.mu) > 1e-12 ? (d.sigma / d.mu).toFixed(3) : 'undefined (&mu; = 0)';
    $('stats').innerHTML = d.stats + ' &nbsp;&nbsp; <b>&sigma;/&mu; = ' + ratio + '</b>';
    // Table of x against Pr_X(x) beside the CDF for the binomial when N < 15.
    // It is filled before drawing so the plots are sized to the space left over.
    var showTable = current === 'binom' && d.probs.length - 1 < 15;
    document.querySelector('.plots').classList.toggle('withtable', showTable);
    $('pmfTable').classList.toggle('hidden', !showTable);
    if (showTable) {
      var rows = '<tr><th><i>x</i></th><th>Pr<sub><i>X</i></sub>(<i>x</i>)</th></tr>';
      for (var k = 0; k < d.probs.length; k++) rows += '<tr><th>' + k + '</th><td>' + d.probs[k].toFixed(4) + '</td></tr>';
      $('pmfTable').innerHTML = '<table>' + rows + '</table>';
    }
    if (d.probs) { drawPmf(d.probs, d.mu, d.sigma); drawDiscreteCdf(d.probs); }
    else drawContinuous(d);
  }

  var tabs = document.querySelectorAll('.tabs button');
  for (var i = 0; i < tabs.length; i++) tabs[i].addEventListener('click', function () {
    current = this.getAttribute('data-dist');
    for (var j = 0; j < tabs.length; j++) {
      var name = tabs[j].getAttribute('data-dist');
      tabs[j].classList.toggle('active', name === current);
      $(name + 'Controls').classList.toggle('hidden', name !== current);
    }
    draw();
  });
  var sliders = document.querySelectorAll('input[type=range]');
  for (i = 0; i < sliders.length; i++) sliders[i].addEventListener('input', draw);
  window.addEventListener('resize', draw);
  draw();
})();
</script>
</body>
</html>
